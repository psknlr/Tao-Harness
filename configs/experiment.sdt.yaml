# TCMEval-SDT: syndrome differentiation.
#
# Access domain: clinical_reasoning only. Formula / Herb / PatentMedicine /
# ExternalTherapy are unreachable, so the agent cannot invert the
# syndrome->treatment mapping to recover the answer from the prescription.

name: tcm-sdt
dataset:
  kind: sdt
  path: data/sdt/Test_TCM_Data_v1.json
  limit: null

task: sdt
domain: clinical_reasoning

models: [deepseek, gemini, glm, gpt, minimax]
# M2C and M3C are compute-matched controls, and they are what make the
# agentic and verification claims interpretable:
#   M2C = M2's static KG + M3's reasoning budget, no adaptive tools
#   M3C = M4's extra revision turn, no verification evidence
# M3 / M3C / M4 share a single agent phase, so M3C -> M4 differs only in the
# verification report. Dropping the controls makes M2->M3 and M3->M4
# uninterpretable; do not trim them to save cost.
conditions: [M0, M1, M2, M2C, M3, M3C, M4]
samples: 1              # >1 enables self-consistency: samples are combined by
                        # per-option majority vote before scoring (see
                        # tcm_eval.scorers.consensus_prediction)

# ---- frozen framework contract: identical for every model ----
decode:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 2048
  seed: 20260829

retrieval:
  alpha_semantic: 0.60
  beta_graph: 0.25
  gamma_source: 0.15
  top_k: 8
  graph_hops: 2
  graph_decay: 0.5

tool_budget:
  max_calls: 12
  max_calls_per_tool: 4
  max_result_chars: 4000

context_budget:
  max_chars: 6000
  max_entities_per_block: 8

max_agent_turns: 16
max_format_retries: 2

output_dir: runs/sdt
concurrency: 4
