# TCM-CP: clinical-pathway execution.
#
# INSTRUMENT-CAPABILITY BENCHMARK, NOT AN EFFECTIVENESS ONE.
# Gold answers are derived from the same knowledge graph the KG arms consult
# (see scripts/build_tcm_cp.py). A KG advantage here is expected by
# construction: it shows the agent can execute a staged pathway faithfully.
# It is not evidence that the graph improves clinical ability, and its
# contrasts must not be pooled with the SDT or PA results.
#
# Access domain: clinical_pathway, which withholds nothing -- executing a
# pathway means deciding on treatment. This is safe here and would not be safe
# for SDT, where treatment access leaks the answer.

name: tcm-cp
dataset:
  kind: cp
  path: data/cp/TCM-CP.json
  limit: 450            # the full build is 5,544 items; sample for cost
  # Balance the sample across subtasks. The prespecified endpoint is the
  # per-subtask macro-average, so every subtask needs enough items to carry a
  # paired test. A head-slice is proportional, which gives CP6 -- the
  # transition decision, and the only subtask with a patient-safety reading --
  # 28 of 400. Even allocation gives it 50.
  stratify: subtask

task: cp
domain: clinical_pathway

models: [deepseek, gemini, glm, gpt, minimax]
conditions: [M0, M1, M2, M2C, M3, M3C, M4]
samples: 1

decode: {temperature: 0.0, top_p: 1.0, max_tokens: 2048, seed: 20260829}
retrieval: {alpha_semantic: 0.60, beta_graph: 0.25, gamma_source: 0.15, top_k: 8, graph_hops: 2, graph_decay: 0.5}
tool_budget: {max_calls: 12, max_calls_per_tool: 4, max_result_chars: 4000}
context_budget: {max_chars: 6000, max_entities_per_block: 8}
max_agent_turns: 16
max_format_retries: 2

output_dir: runs/cp
concurrency: 4
