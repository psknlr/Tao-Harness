# Model registry.
#
# Only `model.generate()` differs between arms; everything else is frozen by
# the framework hash. Decode parameters live in the experiment config, not
# here, so a single edit changes them for every model at once and no model can
# quietly get a different temperature.
#
# ---------------------------------------------------------------------------
# THE model_id VALUES BELOW ARE PLACEHOLDERS. Replace each with the exact
# snapshot string your provider returns, before spending anything.
#
# They are deliberately not guessed at: a model identifier that does not exist
# fails at the first request, but one that exists and is not the model you
# meant produces a full, expensive, quietly wrong experiment. The run manifest
# records whatever you set here alongside the graph and dataset hashes, so the
# paper can state exactly which snapshots produced which numbers -- which a
# marketing name ("the latest Pro model") cannot.
#
# Check what you are actually about to call:
#   python -m runner.benchmark_runner run <config> --limit 2
# and read the model field in runs/*/manifest.*.json.
# ---------------------------------------------------------------------------

models:
  deepseek:
    provider: openai_compat
    model_id: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    input_usd_per_mtok: 0.27
    output_usd_per_mtok: 1.10

  gemini:
    provider: gemini
    model_id: gemini-2.5-pro
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    input_usd_per_mtok: 1.25
    output_usd_per_mtok: 10.00

  glm:
    provider: openai_compat
    model_id: glm-4.6
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: ZHIPU_API_KEY
    input_usd_per_mtok: 0.60
    output_usd_per_mtok: 2.20

  gpt:
    provider: openai_compat
    model_id: gpt-4.1
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    input_usd_per_mtok: 2.00
    output_usd_per_mtok: 8.00

  minimax:
    # Dedicated adapter, not openai_compat: MiniMax returns API errors with
    # HTTP 200 and a non-zero base_resp.status_code, which the generic client
    # reads as a successful empty answer -- lowering MiniMax's answered rate
    # for a reason that is not the model. It may also report only
    # total_tokens; the adapter records that as-is rather than inventing a
    # prompt/completion split.
    provider: minimax
    model_id: MiniMax-Text-01
    base_url: https://api.minimax.chat/v1
    api_key_env: MINIMAX_API_KEY
    input_usd_per_mtok: 0.20
    output_usd_per_mtok: 1.10

  # Poe's OpenAI-compatible gateway. Useful for reaching a model whose
  # first-party API you cannot get, at a real cost to reproducibility: the
  # model_id is a Poe *bot*, and a bot can be repointed at a different upstream
  # snapshot without its name changing, so the manifest cannot pin a snapshot
  # the way a first-party endpoint can. Prefer a first-party adapter where one
  # exists, and say in the paper which models came through here.
  #
  # Sampling controls are forwarded but not guaranteed: run
  #   python -m runner.benchmark_runner smoke --models poe
  # and trust its seed-determinism column over any assumption.
  poe:
    provider: poe
    model_id: GPT-4o          # a Poe bot name, not a snapshot id
    base_url: https://api.poe.com/v1
    api_key_env: POE_API_KEY
    input_usd_per_mtok: 0.0   # Poe bills in compute points, not per token
    output_usd_per_mtok: 0.0

  # Offline model used by the test suite and by `--dry-run`.
  echo:
    provider: echo
    model_id: echo-1

# The judge is pinned separately and scores every arm identically, so judge
# quality is a constant rather than a variable in the comparison.
judge:
  model: gpt
