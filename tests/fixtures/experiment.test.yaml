# Offline end-to-end fixture.
#
# Points at committed synthetic fixtures written in the released SDT schema, not
# at the benchmark files, so the CLI is exercised on every clean checkout --
# including CI, where the datasets are absent by design.
name: tcm-test-sdt
dataset:
  kind: sdt
  path: tests/fixtures/sdt_mini/Mini_TCM_Data.json
  results_path: tests/fixtures/sdt_mini/Results/Mini_data_result.txt
task: sdt
domain: clinical_reasoning
models: [echo]
conditions: [M0, M1, M2, M2C, M3, M3C, M4]
samples: 1
decode: {temperature: 0.0, max_tokens: 512, seed: 7}
retrieval: {top_k: 4, graph_hops: 1}
tool_budget: {max_calls: 4, max_calls_per_tool: 2, max_result_chars: 1500}
context_budget: {max_chars: 3000, max_entities_per_block: 4}
max_agent_turns: 6
output_dir: runs/test
concurrency: 1
